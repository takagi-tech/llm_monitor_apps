<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みはる - LLM稼働モニター</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #f5f0e6;
            --bg-dark: #2d2a24;
            --ink: #1a1814;
            --ink-light: #4a4538;
            --vermillion: #c53d43;
            --gold: #d4a853;
            --indigo: #3d5a80;
            --cream: #fffef8;
            --bamboo: #7d8c5c;
            --shadow: rgba(26, 24, 20, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            background: var(--bg-paper);
            color: var(--ink);
            min-height: 100vh;
            background-image:
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237d8c5c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                linear-gradient(to bottom, #e8e0d0 0%, var(--bg-paper) 30%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 2rem 0 3rem;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 2rem;
            position: relative;
        }

        .header::before,
        .header::after {
            content: "━━";
            position: absolute;
            bottom: -12px;
            color: var(--vermillion);
            font-size: 1.5rem;
        }

        .header::before { left: 20%; }
        .header::after { right: 20%; }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--ink);
            text-shadow: 2px 2px 0 var(--gold);
        }

        .header h1 span {
            color: var(--vermillion);
        }

        .header p {
            font-size: 0.85rem;
            color: var(--ink-light);
            margin-top: 0.75rem;
            letter-spacing: 0.15em;
        }

        .header p.romaji {
            font-size: 0.7rem;
            color: var(--vermillion);
            margin-top: 0.5rem;
            letter-spacing: 0.35em;
            opacity: 0.8;
        }

        /* Add Form */
        .add-form {
            background: var(--cream);
            border: 2px solid var(--ink);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 4px 4px 0 var(--shadow);
            position: relative;
        }

        .add-form::before {
            content: "マシンの登録";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-paper);
            padding: 0 10px;
            font-size: 0.75rem;
            color: var(--vermillion);
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .add-form h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed var(--ink-light);
            letter-spacing: 0.1em;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .form-row input {
            background: var(--bg-paper);
            border: 1px solid var(--ink-light);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.9rem;
            flex: 1;
            min-width: 150px;
        }

        .form-row select {
            background: var(--bg-paper);
            border: 1px solid var(--ink-light);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
        }

        .form-row input:focus,
        .form-row select:focus {
            outline: none;
            border-color: var(--vermillion);
            box-shadow: 0 0 0 2px rgba(197, 61, 67, 0.2);
        }

        .form-row input::placeholder {
            color: var(--ink-light);
        }

        .form-row button {
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 2px;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.1em;
        }

        .form-row button:hover {
            background: var(--vermillion);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        /* Endpoint List */
        .endpoint-list {
            background: var(--cream);
            border: 2px solid var(--ink);
            border-radius: 4px;
            box-shadow: 6px 6px 0 var(--shadow);
            padding: 1rem;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .auto-note {
            font-size: 0.8rem;
            color: var(--ink-light);
            letter-spacing: 0.08em;
        }

        .network-group + .network-group {
            margin-top: 1rem;
        }

        .network-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(61, 90, 128, 0.12) 0%, rgba(212, 168, 83, 0.08) 100%);
            border: 2px solid var(--ink);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            padding: 0.9rem 1.2rem;
        }

        .network-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--indigo);
        }

        .network-count {
            font-size: 0.78rem;
            color: var(--ink-light);
            letter-spacing: 0.08em;
        }

        .network-body {
            background: var(--cream);
            border: 2px solid var(--ink);
            border-top: 1px solid var(--ink-light);
            border-radius: 0 0 4px 4px;
            overflow: hidden;
        }

        .network-empty {
            padding: 1.25rem 1.5rem;
            color: var(--ink-light);
            font-size: 0.9rem;
        }

        .endpoint-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--ink-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: background 0.15s ease;
            position: relative;
        }

        .endpoint-item:last-child {
            border-bottom: none;
        }

        .endpoint-item:hover {
            background: linear-gradient(90deg, rgba(197,61,67,0.05) 0%, transparent 50%);
        }

        .endpoint-item::before {
            content: "┃";
            color: var(--gold);
            margin-right: 0.75rem;
            font-size: 1.2rem;
        }

        .endpoint-info {
            flex: 1;
        }

        .endpoint-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 0.25rem;
            letter-spacing: 0.05em;
        }

        .endpoint-address {
            font-size: 0.9rem;
            color: var(--indigo);
            font-family: monospace;
            letter-spacing: 0.05em;
        }

        .endpoint-model {
            font-size: 0.8rem;
            color: var(--ink-light);
            margin-top: 0.25rem;
            font-style: italic;
        }

        .endpoint-model span {
            color: var(--vermillion);
            font-weight: 600;
            font-style: normal;
        }

        .endpoint-model.no-model {
            color: var(--ink-light);
            font-style: italic;
        }

        .endpoint-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-badge {
            padding: 0.35rem 0.85rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 2px solid;
            position: relative;
        }

        .status-badge::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid currentColor;
            opacity: 0.3;
        }

        .status-online {
            background: linear-gradient(135deg, #2d5a3d 0%, #1a3d2a 100%);
            color: #7dce8c;
            border-color: #4a8c5c;
            text-shadow: 0 0 10px #7dce8c;
        }

        .status-offline {
            background: linear-gradient(135deg, #334a64 0%, #1f2d40 100%);
            color: #9fc4ea;
            border-color: #5c7ea3;
            text-shadow: 0 0 10px #9fc4ea;
        }

        .status-unknown {
            background: linear-gradient(135deg, #4a4a3d 0%, #2d2d1a 100%);
            color: #aeae8c;
            border-color: #7c7c5c;
            text-shadow: 0 0 10px #aeae8c;
        }

        .btn {
            padding: 0.5rem 0.85rem;
            border-radius: 2px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 2px solid;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.3s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-ping {
            background: linear-gradient(135deg, #2d5a3d 0%, #1a3d2a 100%);
            color: #7dce8c;
            border-color: #4a8c5c;
        }

        .btn-ping:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(125, 206, 140, 0.3);
        }

        .btn-ping-all {
            background: linear-gradient(135deg, #3d5a80 0%, #24384f 100%);
            color: #d8e8fb;
            border-color: #6f8eb4;
            padding: 0.7rem 1.2rem;
            font-size: 0.78rem;
        }

        .btn-ping-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(111, 142, 180, 0.35);
        }

        .btn-delete {
            background: linear-gradient(135deg, #5a2d2d 0%, #3d1a1a 100%);
            color: #ce7d7d;
            border-color: #8c4a4a;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(206, 125, 125, 0.3);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Empty State */
        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--ink-light);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        /* Loading */
        .loading {
            padding: 2rem;
            text-align: center;
            color: var(--ink-light);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>み<span>は</span>る</h1>
            <p class="romaji">M　I　H　A　R　U</p>
            <p>～研究室LLM稼働モニター～</p>
        </header>

        <div class="add-form">
            <form hx-post="/api/endpoints" hx-target="#endpoint-content" class="form-row">
                <input type="text" name="name" placeholder="マシン名" required>
                <select name="network" required>
                    <option value="AI2">AI2</option>
                    <option value="AI3">AI3</option>
                </select>
                <input type="text" name="ip" placeholder="IP アドレス" required>
                <input type="number" name="port" placeholder="ポート" required>
                <button type="submit">登録</button>
            </form>
        </div>

        <div id="endpoint-list" class="endpoint-list">
            <div class="toolbar">
                <span class="auto-note">20秒ごとに自動更新中</span>
                <button class="btn btn-ping-all"
                        hx-get="/api/endpoints/refresh"
                        hx-target="#endpoint-content"
                        hx-swap="innerHTML">
                    今すぐ更新
                </button>
            </div>
            <div id="endpoint-content"
                 hx-get="/api/endpoints/refresh"
                 hx-trigger="load, every 20s"
                 hx-swap="innerHTML">
                <div class="loading">読み込み中...</div>
            </div>
        </div>
    </div>
</body>
</html>
