<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Monitor // Lab</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #1a1f2e;
            --bg-card: #141820;
            --border: #2a3347;
            --text-primary: #e4e7eb;
            --text-secondary: #8b95a5;
            --text-muted: #5a6475;
            --accent-cyan: #00d9ff;
            --accent-green: #00ff9d;
            --accent-red: #ff3366;
            --accent-orange: #ff9f1c;
            --accent-purple: #b967ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0, 217, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(185, 103, 255, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Header */
        .header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header h1 span {
            color: var(--accent-cyan);
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Add Form */
        .add-form {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .add-form h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .form-row input {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            flex: 1;
            min-width: 150px;
        }

        .form-row input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.1);
        }

        .form-row input::placeholder {
            color: var(--text-muted);
        }

        .form-row button {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border: none;
            border-radius: 4px;
            padding: 0.75rem 1.5rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .form-row button:hover {
            background: #33e1ff;
            transform: translateY(-1px);
        }

        /* Endpoint List */
        .endpoint-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .endpoint-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: background 0.15s ease;
            animation: slideIn 0.3s ease;
        }

        .endpoint-item:last-child {
            border-bottom: none;
        }

        .endpoint-item:hover {
            background: rgba(0, 217, 255, 0.02);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .endpoint-info {
            flex: 1;
        }

        .endpoint-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .endpoint-address {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        .endpoint-model {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .endpoint-model span {
            color: var(--accent-purple);
        }

        .endpoint-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 0 10px currentColor;
        }

        .status-online {
            background: #00ff9d;
            color: #000;
            text-shadow: 0 0 10px #00ff9d;
            box-shadow: 0 0 20px #00ff9d80, inset 0 0 10px #ffffff40;
        }

        .status-offline {
            background: #ff3366;
            color: #fff;
            text-shadow: 0 0 10px #ff3366;
            box-shadow: 0 0 20px #ff336680, inset 0 0 10px #ffffff40;
        }

        .status-unknown {
            background: #4a5568;
            color: #e4e7eb;
            text-shadow: 0 0 5px #4a5568;
            box-shadow: 0 0 10px #4a556840;
        }

        .btn {
            padding: 0.5rem 0.85rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .btn-ping {
            background: linear-gradient(135deg, #00ff9d 0%, #00cc7d 100%);
            color: #000;
            box-shadow: 0 4px 15px #00ff9d50;
        }

        .btn-ping:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px #00ff9d80;
        }

        .btn-model {
            background: linear-gradient(135deg, #ff9f1c 0%, #e67600 100%);
            color: #000;
            box-shadow: 0 4px 15px #ff9f1c50;
        }

        .btn-model:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px #ff9f1c80;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff3366 0%, #cc1144 100%);
            color: #fff;
            box-shadow: 0 4px 15px #ff336650;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px #ff336680;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Empty State */
        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.85rem;
        }

        /* Loading */
        .loading {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>LLM<span>_</span>Monitor</h1>
            <p>研究室 LLM エンドポイント管理</p>
        </header>

        <div class="add-form">
            <h2>// エンドポイント追加</h2>
            <form hx-post="/api/endpoints" hx-target="#endpoint-list" class="form-row">
                <input type="text" name="name" placeholder="名前" required>
                <input type="text" name="ip" placeholder="IP アドレス" required>
                <input type="number" name="port" placeholder="ポート" required>
                <input type="text" name="api_key" placeholder="APIキー（任意）">
                <button type="submit">追加</button>
            </form>
        </div>

        <div id="endpoint-list" class="endpoint-list">
            <div hx-get="/api/endpoints" hx-trigger="load" hx-swap="innerHTML">
                <div class="loading">loading...</div>
            </div>
        </div>
    </div>
</body>
</html>
